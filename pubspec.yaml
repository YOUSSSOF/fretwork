name: fretwork
description: >-
  Fretwork — an offline guitar practice companion that turns a technique
  curriculum into a daily routine, a session timer, and a discipline score.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  go_router: ^14.2.0
  hive_ce: ^2.7.0
  hive_ce_flutter: ^2.1.0
  path_provider: ^2.1.3
  fl_chart: ^0.68.0
  pdf: ^3.11.0
  printing: ^5.13.0
  collection: ^1.18.0
  intl: ^0.19.0
  wakelock_plus: ^1.7.0
  flutter_soloud: ^4.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.8.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    # Bundled, never fetched: the app makes no network calls, and the PDF
    # needs a Unicode-capable face because the pdf package's built-in
    # Helvetica cannot render anything outside Latin-1.
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700

# Build-time only: regenerate with
#   dart run tool/generate_icon.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#141010"
  adaptive_icon_foreground: assets/icon/foreground.png
  remove_alpha_ios: true
