name: fretwork
description: >-
  Fretwork — an offline guitar practice companion that turns a technique
  curriculum into a daily routine, a session timer, and a discipline score.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  go_router: ^14.2.0
  hive_ce: ^2.7.0
  hive_ce_flutter: ^2.1.0
  path_provider: ^2.1.3
  fl_chart: ^0.68.0
  pdf: ^3.11.0
  printing: ^5.13.0
  soundpool: ^2.4.1
  collection: ^1.18.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
